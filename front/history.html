<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수강내역 조회</title>
  <style>
    body { margin:0; font-family:'Noto Sans KR',sans-serif; background:#fff; }
    .wrap { max-width:1200px; margin:40px auto; background:#fff; border-radius:8px; box-shadow:0 2px 8px #eee; padding:32px; height:100vh; overflow-y:hidden; }
    h2 { margin-bottom:24px; }
    table { width:100%; border-collapse:collapse; margin-bottom:24px; }
    th,td { border:1px solid #ddd; padding:8px; text-align:center; }
    th { background:#f0f0f0; }
    .btn { padding:4px 14px; border:none; background:#1976d2; color:#fff; border-radius:4px; cursor:pointer; }
    .btn:disabled { background:#aaa; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>수강내역 조회</h2>
    <table>
  <thead><tr><th>No</th><th>개설학부</th><th>학과</th><th>학년</th><th>교과목명</th><th>과목번호</th><th>이수구분</th><th>학점</th><th>정원</th></tr></thead>
      <tbody id="history-tbody"></tbody>
    </table>
  </div>
  <script>
    function getRegister() {
      return JSON.parse(localStorage.getItem('registerList')||'[]');
    }
    function renderHistoryTable() {
      const list = getRegister();
      const tbody = document.getElementById('history-tbody');
      tbody.innerHTML = '';
      list.forEach((s,i) => {
        const tr = document.createElement('tr');
  tr.innerHTML = `<td>${i+1}</td><td>${s.dept||''}</td><td>${s.major||''}</td><td>${s.year||''}</td><td>${s.name||''}</td><td>${s.code||''}</td><td>${s.type||''}</td><td>${s.credit||''}</td><td>${s.cap !== undefined ? s.cap : 30}</td>`;
        tbody.appendChild(tr);
      });
    }
    renderHistoryTable();
  </script>
</body>
</html>
