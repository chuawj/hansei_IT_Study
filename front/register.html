<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수강신청</title>
  <link rel="stylesheet" href="../common/style.css">
  <link rel="stylesheet" href="../css/register.css">
  <script src="../js/data_from_real.js"></script>
  <script src="../js/queue.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/register.js"></script>
</head>
<body>
  <div id="toast" class="toast"></div>
  <div class="wrap">
    <div id="queue-modal" style="display:none;position:fixed;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.25);z-index:1000;align-items:center;justify-content:center;">
      <div style="background:#fff;padding:36px 32px 32px 32px;border-radius:12px;box-shadow:0 2px 12px #888;min-width:320px;text-align:center;">
        <div id="queue-msg" style="font-size:1.25em;color:#1976d2;font-weight:bold;margin-bottom:12px;"></div>
        <div id="queue-wait" style="font-size:1.1em;color:#333;margin-bottom:8px;"></div>
      </div>
    </div>
  <h2>수강신청</h2>
  <div class="search-bar" style="display:flex;align-items:center;gap:12px;margin-bottom:24px;">
      <label style="font-weight:bold;">카테고리</label>
      <select id="category-select" style="min-width:140px;height:32px;font-size:1em;">
        <option value="basket">예비수강</option>
        <option value="major">전공/학과 조회</option>
        <option value="subject">과목 검색</option>
        <option value="type">이수 구분</option>
      </select>
      <span id="major-area" style="display:inline-flex;align-items:center;gap:8px;">
        <label style="font-weight:bold;">학부</label>
        <select id="dept-select" style="min-width:120px;height:32px;font-size:1em;"></select>
        <label style="font-weight:bold;">학과</label>
        <select id="major-select" style="min-width:120px;height:32px;font-size:1em;"></select>
      </span>
      <span id="subject-search-area" style="display:none;align-items:center;gap:8px;">
        <label style="font-weight:bold;">조회:</label>
        <input type="text" id="subject-code-input" placeholder="과목번호로 검색" style="height:32px;font-size:1em;width:120px;">
        <label style="font-weight:bold;">과목:</label>
        <select id="subject-list-select" style="min-width:180px;height:32px;font-size:1em;"></select>
      </span>
      <input type="text" id="subject-keyword" placeholder="과목명 검색" style="height:32px;font-size:1em;width:180px;">
      <select id="type-select" style="min-width:120px;height:32px;font-size:1em;display:none;">
        <option value="">전체</option>
        <option value="전공필수">전공필수</option>
        <option value="전공선택">전공선택</option>
        <option value="전공기초">전공기초</option>
        <option value="교양필수">교양필수</option>
        <option value="교양선택">교양선택</option>
        <option value="채플">채플</option>
      </select>
      <button id="search-btn" style="height:34px;font-size:1em;padding:0 18px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;">조회</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;margin-top:-10px;">
      <div style="font-weight:bold;font-size:1.08em;color:#000000;">개설과목 내역</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="color:#d32f2f;font-weight:bold;font-size:0.95em;">빠른 수강신청</span>
        <label style="font-weight:bold;">과목코드-분반 :</label>
  <input type="text" id="quick-code" placeholder="" style="height:21px;font-size:1em;width:110px;">
        <button id="quick-apply-btn" style="height:28px;font-size:1em;padding:0 10px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;">신청</button>
      </div>
    </div>
  <table class="table tableList2" style="overflow-x:unset;width:100%;margin-bottom:20px;">
    <thead><tr><th>No</th><th>개설학부</th><th>학과</th><th>학년</th><th>교과목명</th><th>과목번호</th><th>이수구분</th><th>학점</th><th>정원</th><th>신청</th></tr></thead>
    <tbody id="reg-list"></tbody>
  </table>
  <div style="margin-top:120px;"><b>수강신청 내역</b></div>
  <table id="my-reg" class="table tableList2" style="margin-top:10px;overflow-x:unset;width:100%;">
    <thead><tr><th>No</th><th>개설학부</th><th>학과</th><th>학년</th><th>교과목명</th><th>과목번호</th><th>이수구분</th><th>학점</th><th>정원</th><th>삭제</th></tr></thead>
    <tbody></tbody></table>
  </div>
</body>
</html>
