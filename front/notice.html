<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지사항</title>
  <link rel="stylesheet" href="../common/style.css">
</head>
<body>
  <h2 style="text-align:center; margin-top:40px;">수강신청 연습 시스템에 오신 것을 환영합니다!</h2>
  <div style="max-width:800px; margin:30px auto; background:#f9f9f9; border-radius:8px; padding:32px; font-size:1.3em;">
    <b>안내</b><br>
    - 본 시스템은 실제 수강신청을 연습할 수 있습니다.<br>
    - 본 시스템은 현재 개발중이며 앞으로 여러 과목들이 추가될 예정입니다.<br>
    - 시스템에 있는 과목들은 개설되어 있는 과목들과의 정보와는 다를수 있습니다.<br>
    - 예비수강신청, 정규수강신청 모두 설정한 시간에 맞춰 오픈됩니다.<br>
    - 상단 탭을 눌러 각 기능을 체험해보세요.<br>
    <br>
    <b>Tip</b><br>
    - 신청 오픈 전에는 버튼이 비활성화됩니다.<br>
    - 신청 오픈 후에는 실시간으로 신청 체험이 가능합니다.<br>
  </div>
</body>
</html>
