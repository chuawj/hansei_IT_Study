<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한세대학교 수강신청 연습 메인</title>
  <link rel="stylesheet" href="common/style.css">
  <link rel="stylesheet" href="common/jquery-ui-1.9.2.custom.min.css">
  <script src="common/jquery-1.8.3.js"></script>
  <script src="common/jquery-ui-1.9.2.custom.min.js"></script>
  <style>
    body { background: #f5f5f5; }
    .main-wrap { max-width: 900px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px #ccc; padding: 0; }
    .nav { display: flex; background: #1976d2; border-radius: 8px 8px 0 0; }
    .nav button { flex: 1; padding: 18px 0; background: none; border: none; color: #fff; font-size: 1.1em; cursor: pointer; transition: background 0.2s; }
    .nav button.active, .nav button:hover { background: #1565c0; }
    .frame-area { width: 100%; height: 600px; border: none; }
    .timer { text-align: right; padding: 12px 24px 0 0; color: #1976d2; font-weight: bold; }
  </style>
</head>
<body>
  <div style="padding:10px 20px 0 20px;">
    <div style="display:flex;align-items:flex-start;">
      <div style="min-width:320px;max-width:340px;">
        <img src="common/logo.png" alt="한세대학교" style="margin-bottom:0;">
       
        <div id="timer-setup" style="margin-top:18px;padding:14px 12px 12px 12px;border:1px solid #1976d2;border-radius:8px;background:#f7faff;display:flex;align-items:center;gap:10px;max-width:290px;">
          <b style="margin-right:10px;color:#1976d2;">수강신청 오픈<br>타이머</b>
          <label style="font-size:0.98em;">시 <input type="number" id="timer-hour" min="0" max="23" value="0" style="width:36px;"></label>
          <label style="font-size:0.98em;">분 <input type="number" id="timer-min" min="0" max="59" value="0" style="width:36px;"></label>
          <label style="font-size:0.98em;">초 <input type="number" id="timer-sec" min="0" max="59" value="0" style="width:36px;"></label>
        </div>
        <div style="margin-top:6px;max-width:290px;display:flex;align-items:center;gap:8px;">
          <button id="set-timer-btn" style="background:#1976d2;color:#fff;border:none;border-radius:4px;padding:4px 14px;font-size:1em;">타이머 설정</button>
          <button id="reset-btn" style="background:#d32f2f;color:#fff;border:none;border-radius:4px;padding:4px 14px;font-size:1em;">초기화</button>
          <span id="timer-status" style="color:#1976d2;font-weight:bold;font-size:1em;"></span>
        </div>
      </div>
      <div style="flex:1; min-width:0; margin-left:24px;">
        <div style="display:flex;gap:0;">
          <button class="tab-btn active" data-page="notice" style="border:1px solid #bbb; border-bottom:none; background:#fff; padding:8px 18px; font-size:1em; cursor:pointer;">공지사항</button>
          <button class="tab-btn" data-page="subject" style="border:1px solid #bbb; border-bottom:none; background:#fff; padding:8px 18px; font-size:1em; cursor:pointer;">교과목조회</button>
          <button class="tab-btn" data-page="basket" style="border:1px solid #bbb; border-bottom:none; background:#fff; padding:8px 18px; font-size:1em; cursor:pointer;">예비수강신청</button>
          <button class="tab-btn" data-page="register" style="border:1px solid #bbb; border-bottom:none; background:#fff; padding:8px 18px; font-size:1em; cursor:pointer;">수강신청</button>
          <button class="tab-btn" data-page="history" style="border:1px solid #bbb; border-bottom:none; background:#fff; padding:8px 18px; font-size:1em; cursor:pointer;">수강내역 조회</button>
        </div>

        <div style="border:1px solid #bbb; border-radius:0 0 8px 8px; min-height:700px; background:#fff;">
          <iframe id="main-frame" src="front/notice.html" style="width:100%; height:700px; border:none;"></iframe>
        </div>
        <div style="margin-top:18px;">
          <div style="border:1px solid #bbb; border-radius:8px; background:#fafafa; padding:18px; font-size:1.2em; height:40px; overflow-y:auto;">
            <b>수강신청 연습 시스템에 오신 것을 환영합니다!</b><br>
            <a href="http://sugangnew.hansei.ac.kr:8808/main.html?fake=Wed%20Feb%2026%202025%2019:41:52%20GMT+0900%20(%C7%D1%B1%B9%20%C7%A5%C1%D8%BD%C3)" target="_blank" style="display:inline-flex;align-items:center;text-decoration:none;gap:10px;margin-bottom:10px;">
              
              <b>본수강신청 링크</b>
            </a>
          </div>
          
        </div>
      </div>
    </div>
    <div style="margin-top:10px; color:#666; font-size:0.98em;">※ 예비수강/수강신청 기간, 신청/삭제, 마감 등은 연습용입니다. 실제 신청은 학교 시스템을 이용하세요.</div>
  </div>
  <script>
    const tabMap = {
      notice: 'front/notice.html',
      subject: 'front/subject.html',
      basket: 'front/basket.html',
      register: 'front/register.html',
      history: 'front/history.html'
    };
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = function() {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.page === 'register') {
          localStorage.setItem('registerQueueRequired', 'true');
        }
        mainFrame.src = tabMap[btn.dataset.page];
  mainFrame.style.height = '700px';
      }
    });

    let timerInterval = null;
    let openTime = null;
    const timerStatus = document.getElementById('timer-status');
    const mainFrame = document.getElementById('main-frame');
    const registerBtn = document.querySelector('.tab-btn[data-page="register"]');

    document.getElementById('set-timer-btn').onclick = function() {
      const hour = parseInt(document.getElementById('timer-hour').value, 10) || 0;
      const min = parseInt(document.getElementById('timer-min').value, 10) || 0;
      const sec = parseInt(document.getElementById('timer-sec').value, 10) || 0;

      const now = new Date();
      let openHour = now.getHours() + hour;
      let openMin = now.getMinutes() + min;
      let openSec = now.getSeconds() + sec;

      if (openSec >= 60) {
        openMin += Math.floor(openSec / 60);
        openSec = openSec % 60;
      }
      if (openMin >= 60) {
        openHour += Math.floor(openMin / 60);
        openMin = openMin % 60;
      }
      if (openHour >= 24) {
        openHour = openHour % 24;
      }

      openTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), openHour, openMin, openSec);
      if (openTime <= now) {
        openTime.setDate(openTime.getDate() + 1);
      }

      timerStatus.textContent = "남은 시간: 계산중...";
      registerBtn.disabled = true;
      registerBtn.style.opacity = 0.5;

      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const now = new Date();
        let diff = Math.floor((openTime - now) / 1000);
        if (diff <= 0) {
          clearInterval(timerInterval);
          timerStatus.textContent = "수강신청이 열렸습니다!";
          registerBtn.disabled = false;
          registerBtn.style.opacity = 1;
        } else {
          const h = Math.floor(diff / 3600);
          const m = Math.floor((diff % 3600) / 60);
          const s = diff % 60;
          timerStatus.textContent = `남은 시간: ${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
      }, 500);
    };
    registerBtn.disabled = true;
    registerBtn.style.opacity = 0.5;
    document.getElementById('reset-btn').onclick = function() {
      localStorage.removeItem('registerList');
      localStorage.removeItem('basketList');
      registerBtn.disabled = true;
      registerBtn.style.opacity = 0.5;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.tab-btn[data-page="notice"]').classList.add('active');
  mainFrame.src = tabMap['notice'];
  mainFrame.style.height = '520px';
      timerStatus.textContent = '초기화 완료!';
      setTimeout(()=>{ timerStatus.textContent = ''; }, 1500);
    };
  </script>
</body>
</html>
