<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>한세대학교 수강신청 연습 메인</title>
  <link rel="stylesheet" href="./common/style.css">
  <link rel="stylesheet" href="./css/index.css">
  <script src="./common/jquery-1.8.3.js"></script>
  <script src="./js/index.js"></script>
</head>
<body>
  <div style="padding:10px 20px 0 20px;">
    <div style="display:flex;align-items:flex-start;">
  <div class="side-col" style="min-width:220px;max-width:260px;">
        <img src="common/logo.png" alt="한세대학교" style="margin-bottom:0;">
       
        <div id="timer-setup" class="timer-box">
          <b class="timer-title">수강신청 오픈<br>타이머</b>
          <label for="timer-hour" class="sr">시</label> <input type="number" id="timer-hour" min="0" max="23" value="0" class="timer-input">
          <label for="timer-min" class="sr">분</label> <input type="number" id="timer-min" min="0" max="59" value="0" class="timer-input">
          <label for="timer-sec" class="sr">초</label> <input type="number" id="timer-sec" min="0" max="59" value="0" class="timer-input">
        </div>
        <div class="timer-actions">
          <button id="set-timer-btn" class="btn-primary small">타이머 설정</button>
          <button id="reset-btn" class="btn-danger small">초기화</button>
          <span id="timer-status" class="timer-status"></span>
        </div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:6px;">
          <input type="checkbox" id="queue-toggle" style="vertical-align:middle;width:15px;height:15px;">
          <span style="font-size:0.97em;font-weight:500;">대기열</span>
          <span id="queue-status" style="font-size:0.97em;color:#1976d2;margin-left:2px;"></span>
        </div>
      </div>
      <div style="flex:1; min-width:0; margin-left:24px;">
        <div class="nav">
          <button class="tab-btn active" data-page="notice">공지사항</button>
          <button class="tab-btn" data-page="subject">교과목조회</button>
          <button class="tab-btn" data-page="basket">예비수강신청</button>
          <button class="tab-btn" data-page="register">수강신청</button>
          <button class="tab-btn" data-page="history">수강내역 조회</button>
        </div>

        <div class="content-panel">
          <iframe id="main-frame" src="front/notice.html" style="width:100%; height:700px; border:none;"></iframe>
        </div>
        <div style="margin-top:18px;">
            <div style="border:1px solid #bbb; border-radius:8px; background:#fafafa; padding:18px; font-size:1.1em; min-height:40px; display:flex; flex-direction:column; gap:8px;">
            <span style="font-weight:bold; color:#000000a0;">수강신청 연습 시스템에 오신 것을 환영합니다!</span>
            <a href="http://sugangnew.hansei.ac.kr:8808/main.html?fake=Wed%20Feb%2026%202025%2019:41:52%20GMT+0900%20(%C7%D1%B1%B9%20%C7%A5%C1%D8%BD%C3)" target="_blank" style="color:#1565c0; text-decoration:underline; font-weight:bold;">
              본수강신청 바로가기
            </a>
            </div>
          </div>
          
        </div>
      </div>
    </div>
    <div style="margin-top:10px; color:#666; font-size:0.98em;">※ 예비수강/수강신청 기간, 신청/삭제, 마감 등은 연습용입니다. 실제 신청은 학교 시스템을 이용하세요.</div>
  </div>
</body>
</html>
